# Coolify on a Hostinger VPS — test stack for https://erp.agileclix.com
#
# Deploy (Coolify):
#   1. Point DNS: A record erp.agileclix.com -> the VPS public IP.
#   2. New resource -> Git repository -> this repo, branch develop.
#      Build pack: Docker Compose. Compose file: docker-compose.yml.
#   3. After Coolify loads the file, open Domains and set the frontend service to:
#        https://erp.agileclix.com:8080
#      The :8080 is the container port. Public traffic stays on 443.
#   4. Deploy. The first run creates the MariaDB database and the ERPNext site.
#      That usually takes 10-20 minutes. Watch the create-site logs.
#   5. Coolify Production env (example):
#        SITE_NAME=erp.agileclix.com
#        SERVICE_PASSWORD_64_ADMIN=admin@erp.com
#        SERVICE_PASSWORD_64_MARIADB=Admin@123
#      Redeploy so admin-password-sync runs.
#   6. Sign in at https://erp.agileclix.com (the field is labeled Email but use the username):
#        Username: Administrator
#        Password: SERVICE_PASSWORD_64_ADMIN only (not SERVICE_PASSWORD_64_MARIADB).
#
# MariaDB root password (SERVICE_PASSWORD_64_MARIADB) is for the db service only, not ERP login.
# Do not publish port 3306. The database is only reachable inside this stack.
# Volumes db-data and sites keep the test database across redeploys.
#
# Builds AgileClix-branded ERPNext from ./Dockerfile (layers agileclix_branding on official erpnext).
# Override only if you publish a prebuilt image: AGILECLIX_ERP_IMAGE=myregistry/agileclix-erpnext:v16.50.0
#
# Optional headless UI (web + gateway): set Coolify domains on services web:3000 and gateway:8000.
# Env: AGILECLIX_GATEWAY_PUBLIC_URL, AGILECLIX_HEADLESS_URL (https URL of web app), AGILECLIX_FRAPPE_DESK_URL

services:
  configurator:
    image: ${AGILECLIX_ERP_IMAGE:-agileclix-erpnext:v16.50.0}
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        ls -1 apps > sites/apps.txt
        for custom_app in agileclix_branding agileclix_erp; do
          if [ -d "apps/$${custom_app}/$${custom_app}/public" ]; then
            grep -qx "$${custom_app}" sites/apps.txt 2>/dev/null || echo "$${custom_app}" >> sites/apps.txt
            mkdir -p "sites/assets/$${custom_app}"
            cp -a "apps/$${custom_app}/$${custom_app}/public/." "sites/assets/$${custom_app}/"
          fi
        done
        bench set-config -g db_host "$$DB_HOST"
        bench set-config -gp db_port "$$DB_PORT"
        bench set-config -g redis_cache "redis://$$REDIS_CACHE"
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE"
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE"
        bench set-config -gp socketio_port "$$SOCKETIO_PORT"
        bench set-config -g proxy_ssl_header "X-Forwarded-Proto"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  create-site:
    image: ${AGILECLIX_ERP_IMAGE:-agileclix-erpnext:v16.50.0}
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        wait-for-it -t 180 db:3306
        wait-for-it -t 120 redis-cache:6379
        wait-for-it -t 120 redis-queue:6379
        start=$$(date +%s)
        until [ -n "$$(jq -r '.db_host // empty' sites/common_site_config.json 2>/dev/null || true)" ]; do
          echo "Waiting for sites/common_site_config.json"
          sleep 5
          if [ $$(( $$(date +%s) - start )) -gt 180 ]; then
            echo "common_site_config.json was not ready"
            exit 1
          fi
        done
        site_has_erpnext() {
          bench --site "$$1" list-apps 2>/dev/null | grep -qx erpnext
        }
        site_has_app() {
          bench --site "$$1" list-apps 2>/dev/null | grep -qx "$$2"
        }
        install_custom_app() {
          local app="$$1"
          if site_has_app "$${SITE_NAME}" "$${app}"; then
            return 0
          fi
          echo "Installing $${app} on $${SITE_NAME}"
          if ! bench --site "$${SITE_NAME}" install-app "$${app}"; then
            echo "WARN: install-app $${app} failed"
            return 1
          fi
          return 0
        }
        ls -1 apps > sites/apps.txt
        for custom_app in agileclix_branding agileclix_erp; do
          if [ -d "apps/$${custom_app}" ]; then
            grep -qx "$${custom_app}" sites/apps.txt 2>/dev/null || echo "$${custom_app}" >> sites/apps.txt
            if [ -x env/bin/pip ]; then
              env/bin/pip install -q -e "apps/$${custom_app}" || echo "WARN: pip install $${custom_app}"
            fi
          fi
        done
        site_ready=0
        if site_has_erpnext "$${SITE_NAME}"; then
          site_ready=1
        elif [ -f "sites/$${SITE_NAME}/site_config.json" ]; then
          echo "Site directory exists; attempting recover via migrate"
          bench --site "$${SITE_NAME}" migrate || true
          if site_has_erpnext "$${SITE_NAME}"; then
            site_ready=1
          fi
        fi
        if [ "$$site_ready" -eq 0 ]; then
          echo "Creating site $${SITE_NAME}"
          if [ -d "sites/$${SITE_NAME}" ]; then
            echo "Removing incomplete site directory before new-site"
            rm -rf "sites/$${SITE_NAME}"
          fi
          if ! bench new-site --force \
            --mariadb-user-host-login-scope='%' \
            --admin-password="$${ADMIN_PASSWORD}" \
            --db-root-username=root \
            --db-root-password="$${DB_ROOT_PASSWORD}" \
            --install-app erpnext \
            --set-default \
            "$${SITE_NAME}"; then
            echo "new-site failed; attempting drop-site and retry"
            bench drop-site "$${SITE_NAME}" --db-root-password="$${DB_ROOT_PASSWORD}" --force || true
            bench new-site --force \
              --mariadb-user-host-login-scope='%' \
              --admin-password="$${ADMIN_PASSWORD}" \
              --db-root-username=root \
              --db-root-password="$${DB_ROOT_PASSWORD}" \
              --install-app erpnext \
              --set-default \
              "$${SITE_NAME}"
          fi
        else
          echo "Site $${SITE_NAME} already has erpnext"
        fi
        install_custom_app agileclix_erp || true
        if site_has_app "$${SITE_NAME}" agileclix_erp; then
          echo "agileclix_erp installed; skipping legacy agileclix_branding install"
        else
          install_custom_app agileclix_branding || true
        fi
        bench --site "$${SITE_NAME}" migrate
        for custom_app in agileclix_branding agileclix_erp; do
          if [ -d "apps/$${custom_app}/$${custom_app}/public" ]; then
            mkdir -p "sites/assets/$${custom_app}"
            cp -a "apps/$${custom_app}/$${custom_app}/public/." "sites/assets/$${custom_app}/" || true
          fi
        done
        if site_has_app "$${SITE_NAME}" agileclix_erp; then
          bench --site "$${SITE_NAME}" execute agileclix_erp.boot.sync_branding_settings || true
        elif site_has_app "$${SITE_NAME}" agileclix_branding; then
          bench --site "$${SITE_NAME}" execute agileclix_branding.boot.sync_branding_settings || true
        fi
        if [ -n "$${AGILECLIX_HEADLESS_URL:-}" ]; then
          bench --site "$${SITE_NAME}" set-config agileclix_headless_url "$${AGILECLIX_HEADLESS_URL}"
        fi
        bench --site "$${SITE_NAME}" set-config host_name "https://$${SITE_NAME}"
        bench --site "$${SITE_NAME}" set-config -p developer_mode 0
        bench --site "$${SITE_NAME}" set-admin-password "$${ADMIN_PASSWORD}"
        bench --site "$${SITE_NAME}" clear-cache || true
        echo "Site $${SITE_NAME} is ready (Administrator password matches SERVICE_PASSWORD_64_ADMIN)"
    environment:
      SITE_NAME: ${SITE_NAME:-erp.agileclix.com}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_64_ADMIN:-admin}
      DB_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MARIADB:?}
      AGILECLIX_HEADLESS_URL: ${AGILECLIX_HEADLESS_URL:-}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  # Runs on every deploy so Administrator matches SERVICE_PASSWORD_64_ADMIN in Coolify.
  admin-password-sync:
    image: ${AGILECLIX_ERP_IMAGE:-agileclix-erpnext:v16.50.0}
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        if [ ! -f "sites/$${SITE_NAME}/site_config.json" ]; then
          echo "Site $${SITE_NAME} not created yet; skipping password sync"
          exit 0
        fi
        wait-for-it -t 120 db:3306
        bench --site "$${SITE_NAME}" set-admin-password "$${ADMIN_PASSWORD}"
        echo "Administrator password synced for $${SITE_NAME}"
    environment:
      SITE_NAME: ${SITE_NAME:-erp.agileclix.com}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_64_ADMIN:-admin}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-buffer-pool-size=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MARIADB:?}
      MARIADB_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MARIADB:?}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${AGILECLIX_ERP_IMAGE:-agileclix-erpnext:v16.50.0}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      create-site:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wait-for-it", "-t", "5", "127.0.0.1:8000"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  websocket:
    image: ${AGILECLIX_ERP_IMAGE:-agileclix-erpnext:v16.50.0}
    restart: unless-stopped
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      create-site:
        condition: service_completed_successfully

  queue-short:
    image: ${AGILECLIX_ERP_IMAGE:-agileclix-erpnext:v16.50.0}
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "short,default"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      create-site:
        condition: service_completed_successfully

  queue-long:
    image: ${AGILECLIX_ERP_IMAGE:-agileclix-erpnext:v16.50.0}
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "long,default,short"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      create-site:
        condition: service_completed_successfully

  scheduler:
    image: ${AGILECLIX_ERP_IMAGE:-agileclix-erpnext:v16.50.0}
    restart: unless-stopped
    command: ["bench", "schedule"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      create-site:
        condition: service_completed_successfully

  frontend:
    image: ${AGILECLIX_ERP_IMAGE:-agileclix-erpnext:v16.50.0}
    restart: unless-stopped
    command: ["nginx-entrypoint.sh"]
    expose:
      - "8080"
    environment:
      # Coolify reads this and routes the public domain to container port 8080.
      SERVICE_URL_FRONTEND_8080: ${SERVICE_URL_FRONTEND_8080:-https://erp.agileclix.com}
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-erp.agileclix.com}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "300"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_started
    healthcheck:
      test: ["CMD", "wait-for-it", "-t", "5", "127.0.0.1:8080"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Headless AgileClix UI — assign a domain in Coolify (e.g. app.erp.agileclix.com → port 3000).
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DEBUG: "false"
      FRAPPE_BASE_URL: http://backend:8000
      FRAPPE_SITE: ${SITE_NAME:-erp.agileclix.com}
      CORS_ORIGINS: ${AGILECLIX_CORS_ORIGINS:-https://erp.agileclix.com,http://localhost:3000}
      SERVICE_URL_GATEWAY_8000: ${SERVICE_URL_GATEWAY:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_GATEWAY_URL: ${AGILECLIX_GATEWAY_PUBLIC_URL:-http://localhost:8100}
      NEXT_PUBLIC_FRAPPE_DESK_URL: ${AGILECLIX_FRAPPE_DESK_URL:-https://erp.agileclix.com/desk}
      SERVICE_URL_WEB_3000: ${SERVICE_URL_WEB:-}
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:
