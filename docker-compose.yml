# Coolify on a Hostinger VPS — test stack for https://erp.agileclix.com
#
# Deploy (Coolify):
#   1. Point DNS: A record erp.agileclix.com -> the VPS public IP.
#   2. New resource -> Git repository -> this repo, branch develop.
#      Build pack: Docker Compose. Compose file: docker-compose.yml.
#   3. After Coolify loads the file, open Domains and set the frontend service to:
#        https://erp.agileclix.com:8080
#      The :8080 is the container port. Public traffic stays on 443.
#   4. Deploy. The first run creates the MariaDB database and the ERPNext site.
#      That usually takes 10-20 minutes. Watch the create-site logs.
#   5. Log in at https://erp.agileclix.com
#      User: Administrator
#      Password: Coolify environment variable SERVICE_PASSWORD_64_ADMIN
#
# MariaDB root password: SERVICE_PASSWORD_64_MARIADB (same screen).
# Do not publish port 3306. The database is only reachable inside this stack.
# Volumes db-data and sites keep the test database across redeploys.
#
# This stack runs the official frappe/erpnext:v16.50.0 image (stable test target).
# This git branch is ERPNext 17.0.0-dev and is not what the containers execute.
# Change FRAPPE_VERSION in Coolify only when you intend to move off that image.

services:
  configurator:
    image: ${FRAPPE_IMAGE:-frappe/erpnext}:${FRAPPE_VERSION:-v16.50.0}
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host "$$DB_HOST"
        bench set-config -gp db_port "$$DB_PORT"
        bench set-config -g redis_cache "redis://$$REDIS_CACHE"
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE"
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE"
        bench set-config -gp socketio_port "$$SOCKETIO_PORT"
        bench set-config -g proxy_ssl_header X-Forwarded-Proto
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  create-site:
    image: ${FRAPPE_IMAGE:-frappe/erpnext}:${FRAPPE_VERSION:-v16.50.0}
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        wait-for-it -t 180 db:3306
        wait-for-it -t 120 redis-cache:6379
        wait-for-it -t 120 redis-queue:6379
        start=$$(date +%s)
        until [ -n "$$(jq -r '.db_host // empty' sites/common_site_config.json 2>/dev/null || true)" ]; do
          echo "Waiting for sites/common_site_config.json"
          sleep 5
          if [ $$(( $$(date +%s) - start )) -gt 180 ]; then
            echo "common_site_config.json was not ready"
            exit 1
          fi
        done
        site_ready=0
        if [ -f "sites/$${SITE_NAME}/site_config.json" ]; then
          if bench --site "$${SITE_NAME}" mariadb -N -e "SHOW TABLES LIKE 'tabModule Def'" 2>/dev/null | grep -q "tabModule Def"; then
            site_ready=1
          fi
        fi
        if [ "$$site_ready" -eq 1 ]; then
          echo "Site $${SITE_NAME} already exists; running migrate"
          bench --site "$${SITE_NAME}" migrate
        else
          echo "Creating site $${SITE_NAME}"
          rm -rf "sites/$${SITE_NAME}"
          bench new-site --force \
            --mariadb-user-host-login-scope='%' \
            --admin-password="$${ADMIN_PASSWORD}" \
            --db-root-username=root \
            --db-root-password="$${DB_ROOT_PASSWORD}" \
            --install-app erpnext \
            --set-default \
            "$${SITE_NAME}"
        fi
        bench --site "$${SITE_NAME}" set-config host_name "https://$${SITE_NAME}"
        bench --site "$${SITE_NAME}" set-config -p developer_mode 0
        echo "Site $${SITE_NAME} is ready"
    environment:
      SITE_NAME: ${SITE_NAME:-erp.agileclix.com}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_64_ADMIN:?}
      DB_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MARIADB:?}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-buffer-pool-size=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MARIADB:?}
      MARIADB_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MARIADB:?}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${FRAPPE_IMAGE:-frappe/erpnext}:${FRAPPE_VERSION:-v16.50.0}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      create-site:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wait-for-it", "-t", "5", "127.0.0.1:8000"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  websocket:
    image: ${FRAPPE_IMAGE:-frappe/erpnext}:${FRAPPE_VERSION:-v16.50.0}
    restart: unless-stopped
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      create-site:
        condition: service_completed_successfully

  queue-short:
    image: ${FRAPPE_IMAGE:-frappe/erpnext}:${FRAPPE_VERSION:-v16.50.0}
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "short,default"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      create-site:
        condition: service_completed_successfully

  queue-long:
    image: ${FRAPPE_IMAGE:-frappe/erpnext}:${FRAPPE_VERSION:-v16.50.0}
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "long,default,short"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      create-site:
        condition: service_completed_successfully

  scheduler:
    image: ${FRAPPE_IMAGE:-frappe/erpnext}:${FRAPPE_VERSION:-v16.50.0}
    restart: unless-stopped
    command: ["bench", "schedule"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      create-site:
        condition: service_completed_successfully

  frontend:
    image: ${FRAPPE_IMAGE:-frappe/erpnext}:${FRAPPE_VERSION:-v16.50.0}
    restart: unless-stopped
    command: ["nginx-entrypoint.sh"]
    expose:
      - "8080"
    environment:
      # Coolify reads this and routes the public domain to container port 8080.
      SERVICE_URL_FRONTEND_8080: ${SERVICE_URL_FRONTEND_8080:-https://erp.agileclix.com}
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-erp.agileclix.com}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "300"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_started
    healthcheck:
      test: ["CMD", "wait-for-it", "-t", "5", "127.0.0.1:8080"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:
