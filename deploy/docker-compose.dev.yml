# Local headless stack: ERP (docker-compose.yml) + gateway + Next.js web.
# Usage:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.dev.yml up -d --build

services:
  gateway:
    build:
      context: ../services/gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8100:8000"
    environment:
      DEBUG: "true"
      FRAPPE_BASE_URL: http://backend:8000
      FRAPPE_SITE: ${SITE_NAME:-erp.agileclix.com}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8100
    depends_on:
      gateway:
        condition: service_healthy
