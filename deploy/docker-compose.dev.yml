# Local port publishing for web + gateway (services defined in docker-compose.yml).
# Usage: docker compose -f docker-compose.yml -f deploy/docker-compose.dev.yml up -d --build

services:
  gateway:
    ports:
      - "8100:8000"
    environment:
      DEBUG: "true"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

  web:
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8100
